<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <h1> Calculator Project </h1>

    <div id="calculator">
        <h4 id="display"></h4>

        <div class="row">
            <button id="fn0" onclick="fn0()">0</button>
            <button id="fn1" onclick="fn1()">1</button>
            <button id="fn2" onclick="fn2()">2</button>
            <button id="fn3" onclick="fn3()">3</button>
        </div>

        <div class="row">
            <button id="fn4" onclick="fn4()">4</button>
            <button id="fn5" onclick="fn5()">5</button>
            <button id="fn6" onclick="fn6()">6</button>
            <button id="fn7" onclick="fn7()">7</button>
        </div>

        <div class="row">
            <button id="fn8" onclick="fn8()">8</button>
            <button id="fn9" onclick="fn9()">9</button>
            <button id="eraser" onclick="feraser()">E</button>
            <button id="ad" onclick="addition()">+</button>
        </div>

        <div class="row">
            <button id="mn" onclick="mn()">-</button>
            <button id="ml" onclick="ml()">*</button>
            <button id="dv" onclick="dv()">/</button>
            <button id="eq" onclick="eq()">=</button>
            <button id="ac" onclick="AC()">AC</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function fn0(){ document.getElementById("display").innerHTML += 0; }
        function fn1(){ document.getElementById("display").innerHTML += 1; }
        function fn2(){ document.getElementById("display").innerHTML += 2; }
        function fn3(){ document.getElementById("display").innerHTML += 3; }
        function fn4(){ document.getElementById("display").innerHTML += 4; }
        function fn5(){ document.getElementById("display").innerHTML += 5; }
        function fn6(){ document.getElementById("display").innerHTML += 6; }
        function fn7(){ document.getElementById("display").innerHTML += 7; }
        function fn8(){ document.getElementById("display").innerHTML += 8; }
        function fn9(){ document.getElementById("display").innerHTML += 9; }

        function feraser(){
            let previous = document.getElementById("display").innerHTML;
            document.getElementById("display").innerHTML = previous.slice(0, -1);
        }

        let firstsave;
        let op;

        function addition(){
            firstsave = document.getElementById("display").innerHTML;
            document.getElementById("display").innerHTML = 0;
            op = 1;
        }

        function mn(){
            firstsave = document.getElementById("display").innerHTML;
            document.getElementById("display").innerHTML = 0;
            op = 2;
        }

        function ml(){
            firstsave = document.getElementById("display").innerHTML;
            document.getElementById("display").innerHTML = 0;
            op = 3;
        }

        function dv(){
            firstsave = document.getElementById("display").innerHTML;
            document.getElementById("display").innerHTML = 0;
            op = 4;
        }

        function AC(){
            document.getElementById("display").innerHTML = 0;
        }

        function eq(){
            let secondSave = document.getElementById("display").innerHTML;
            if(op == 1){
                document.getElementById("display").innerHTML = parseInt(firstsave) + parseInt(secondSave);
            }else if(op == 2){
                document.getElementById("display").innerHTML = parseInt(firstsave) - parseInt(secondSave);
            }else if(op == 3){
                document.getElementById("display").innerHTML = parseInt(firstsave) * parseInt(secondSave);
            }else if(op == 4){
                document.getElementById("display").innerHTML = parseInt(firstsave) / parseInt(secondSave);
            }
        }
    </script>

</body>
</html>
